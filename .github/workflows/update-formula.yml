name: update-formula

# Keeps Formula/oct.rb tracking the latest stable GitHub Release of
# suho-han/one-click-ai-tools. Polling the /releases/latest endpoint on a
# schedule needs no cross-repo token: this repo's own GITHUB_TOKEN can push
# the formula bump. Prereleases never appear on that endpoint, so -beta.N
# tags stay on the install.sh channel.
#
# Most scheduled runs are no-ops (checkout + two API calls): the commit only
# runs when scripts/update-formula.sh actually bumped the formula.
# repository_dispatch("oct-release") is wired so the main repo can
# trigger an immediate update later; until then the cron is the only trigger.
# Note: GitHub disables repo schedules after 60 days without any commit —
# each release bumps the formula, which normally keeps this repo active.

on:
  schedule:
    # Once a day (02:37 UTC = 11:37 KST); an off-the-hour minute because
    # GitHub throttles whole-hour crons. A release reaches the tap within a
    # day, or immediately via repository_dispatch once that's wired up.
    - cron: '37 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [oct-release]

concurrency:
  group: update-formula
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update formula to latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-formula.sh

      - name: Detect formula change
        id: diff
        run: |
          if git diff --quiet HEAD -- Formula/oct.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # scripts/update-formula.sh already fail-closed-verified every asset's
      # sha256 against the real tarball bytes before writing the formula, so
      # the commit below can trust the file it pushed.
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          tag="$(sed -n 's|.*releases/download/\([^/]*\)/.*|\1|p' Formula/oct.rb | head -n1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/oct.rb
          git commit -m "chore: update oct to ${tag}"
          git push
